name: Code analysis

on:
  pull_request:
    branches:
      - master
      - main
      - 'team/**'

permissions:
  contents: read

jobs:
  pmd-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: current

      # PMD runs through the build's own gate (gradle/pmd.gradle) rather than the standalone PMD
      # CLI action. The Gradle task hands PMD the compiled classes as its auxclasspath, so rules
      # that need type resolution answer correctly, and the PMD version is the build's own rather
      # than one free to float. pmdMain fails the job on a real violation by itself
      # (ignoreFailures = false), so no separate violation-counting step is needed.
      - name: PMD (main sources)
        run: ./gradlew pmdMain

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pmd-report
          path: build/reports/pmd/
          if-no-files-found: ignore
