name: CodeQL

on:
  pull_request:
    branches:
      - master
      - main
      - 'team/**'

  schedule:
    - cron: '36 5 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: current
          gradle-home-cache-includes: |
            caches
            configuration-cache

      - name: Pre-pull integration images
        run: |
          docker pull postgres:16-alpine
          docker pull wiremock/wiremock:3.9.1
          docker pull mcr.microsoft.com/azure-storage/azurite:3.33.0
          docker pull eclipse-temurin:25-jre
          docker pull testcontainers/ryuk:0.12.0

      - name: Gradle Build
        run: |
          ./gradlew build cyclonedxDirectBom -x test -x integration

      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
      #   If the (auto)build fails above, remove it and uncomment the following three lines.
      #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

      - name: Log generated SBOM Hash
        run: sha256sum build/resources/main/META-INF/sbom/application.cdx.json || true

        # This ensures:
        # - The SBOM is archived with the CodeQL scan output
        # - It's available to download and inspect from the GitHub Actions UI
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/resources/main/META-INF/sbom/application.cdx.json

  DAST:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: current
          gradle-home-cache-includes: |
            caches
            configuration-cache

      - name: Pre-pull integration images
        run: |
          docker pull postgres:16-alpine
          docker pull wiremock/wiremock:3.9.1
          docker pull mcr.microsoft.com/azure-storage/azurite:3.33.0
          docker pull eclipse-temurin:25-jre
          docker pull testcontainers/ryuk:0.12.0

      - name: Gradle Build
        run: ./gradlew build -x test -x integration

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: DAST - Build and run containerised app
        env:
          SERVER_PORT: 8082
        run: |
          # Approach as docker/Dockerfile copies build/libs/*.jar
          # and runs the non '-plain' jar, so no JAR_FILENAME/JAR_FILE_PATH is needed. Just check it exists.
          if ! ls build/libs/*.jar 2>/dev/null | grep -qv -- '-plain\.jar$'; then
            echo "No Spring Boot jar found in build/libs"; ls -la build/libs || true; exit 1
          fi

          docker compose -f docker/docker-compose.integration.yml up -d --build

          echo "Waiting for health endpoint..."
          for i in {1..30}; do
            if curl -sf "http://localhost:${SERVER_PORT}/casemanagement-service/actuator/health" > /dev/null; then
              echo "App is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "App did not become healthy"
              docker compose -f docker/docker-compose.integration.yml ps
              docker compose -f docker/docker-compose.integration.yml logs --tail=200 app
              exit 1
            fi
            echo "Waiting for app to be healthy ($i)..."
            sleep 2
          done

      - name: Run OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8082/casemanagement-service"
          cmd_options: "-a -J zap_report.json -r zap_report.html"

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v7
        with:
          name: zap-html-report
          path: zap_report.html
